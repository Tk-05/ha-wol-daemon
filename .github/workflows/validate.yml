name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly, to notice when a new Home Assistant breaks something
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Installed as a custom repository, not listed in the HACS default store, so the
          # store-only checks don't apply: brands (icon in home-assistant/brands), license,
          # and the repository's GitHub description and topics.
          ignore: brands license description topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest
