name: Release

# Publishes a GitHub release, which is what HACS offers as versions (without releases it
# can only install the latest commit). Either push a tag like v0.2.0, or start this
# workflow by hand on main (Actions → Release → Run workflow): it then tags the commit
# with the version from manifest.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          manifest=$(python3 -c 'import json; print(json.load(open("custom_components/wol_daemon/manifest.json"))["version"])')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $manifest in manifest.json"
            exit 1
          fi
          echo "tag=v$manifest" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump version in manifest.json first"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
